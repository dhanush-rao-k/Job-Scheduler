spring.application.name=Job-Scheduler
spring.datasource.url=jdbc:postgresql://localhost:5432/job_scheduler
spring.datasource.username=${DB_USERNAME:postgres}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:job-scheduler}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=${KAFKA_CONSUMER_CONCURRENCY:2}
job.scheduler.dispatch-rate-ms=${JOB_SCHEDULER_DISPATCH_RATE_MS:5000}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
